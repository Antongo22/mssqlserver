name: mssqlserver

services:
  mssql:
    build:
      context: .
      dockerfile: Dockerfile
    image: mssqlserver-local:2022
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_backups:/var/opt/mssql/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  admin:
    build: ./admin
    volumes:
      - mssql_backups:/backups
      - studio_data:/config
    environment:
      MSSQL_HOST: mssql
      STUDIO_DIR: /config
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3000"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 15s

volumes:
  mssql_data:
    name: mssqlserver_mssql_data
  mssql_backups:
    name: mssqlserver_backups
  studio_data:
    name: mssqlserver_studio
